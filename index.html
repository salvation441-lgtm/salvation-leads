<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salvation Tech Hub - Free Demo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&display=swap');
*{box-sizing:border-box;font-family:Outfit,sans-serif}body{margin:0;background:#0a0f2a;color:#fff}
.ghana-bar{height:8px;background:linear-gradient(90deg,#CE1126,#FCD116,#006B3F,#000)}
.wrap{max-width:460px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,#FFD60A,#FF6B35);border-radius:10px;display:grid;place-items:center;color:#000;font-size:20px}
.contact{font-size:11px;color:#9bb0ff;text-align:right}.contact b{color:#22c55e;font-size:12px}
.badge{background:linear-gradient(90deg,#FFD60A,#FF8A00);color:#000;font-weight:900;padding:10px 18px;border-radius:999px;font-size:13px;display:inline-block}
h1{font-size:42px;line-height:.9;margin:12px 0;font-weight:900}.blue{color:#6ec7ff}.green{color:#34ff8a}
.sub{color:#aab6ff;font-size:14px}
.alert{margin:14px 0;border-radius:16px;padding:12px;background:rgba(255,107,138,.15);border:1px solid rgba(255,107,138,.4);font-size:13px}
.card{background:linear-gradient(180deg,#16215a,#121a42);border:1px solid #263587;border-radius:22px;padding:18px;margin-top:12px}
label{font-size:12px;font-weight:700;margin:12px 0 6px;display:block;color:#c8d3ff}
input,select{width:100%;padding:14px;border-radius:12px;border:1.5px solid #2a3c90;background:#0e1844;color:#fff}
.btn{width:100%;padding:16px;background:linear-gradient(180deg,#22c55e,#16a34a);color:#fff;border:none;border-radius:12px;font-weight:900;font-size:16px;margin-top:16px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(120px);background:#111a3f;border:1px solid #2a3c90;padding:12px 16px;border-radius:12px;font-size:13px;transition:.35s;opacity:0;z-index:9999}.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<div class="ghana-bar"></div>
<div class="wrap">
<div class="top">
<div class="logo"><div class="logo-icon">S</div> Salvation Tech Hub</div>
<div class="contact">WhatsApp Us<br><b>0540 042 669</b></div>
</div>
<div class="badge">🇬🇭 FIRST 5 FREE • ACCRA • GHANA • 24H</div>
<h1>GET YOUR<br><span class="blue">SHOP</span> <span class="green">ONLINE</span><br>IN 24 HOURS!</h1>
<div class="sub">We build <b style="color:#fff">FREE demo store</b> for first 5 businesses. No pay until you like am!</div>
<div class="alert">🔥 <b>3 SLOTS LEFT TODAY</b> — Any business in Ghana can claim!</div>
<div class="card">
<b style="color:#7ec8ff">👋 CLAIM YOUR FREE DEMO NOW:</b>
<label>Business Name *</label><input id="biz" placeholder="Akosia Fashion">
<label>What You Sell? *</label><select id="sell"><option>Fashion Shop</option><option>Electronics</option><option>Food</option><option>Beauty</option><option>Other</option></select>
<label>WhatsApp Number *</label><input id="wa" placeholder="0558 758 76">
<label>Location *</label><input id="loc" placeholder="Kumasi">
<label>Products?</label><input id="prod" placeholder="24">
<button class="btn" onclick="claim()">CLAIM MY FREE DEMO →</button>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const SHEET_URL = "PASTE_YOUR_GOOGLE_SCRIPT_URL_HERE"; // <-- put your URL here
let leads=JSON.parse(localStorage.getItem('sal_v3')||'[]');
function showToast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
function claim(){
 const b=biz.value.trim(),w=wa.value.trim(),l=loc.value.trim();
 if(!b||!w||!l){showToast('⚠️ Fill Business, WhatsApp & Location');return;}
 const d={biz:b,sell:sell.value,wa:w,loc:l,prod:prod.value};
 leads.unshift(d);localStorage.setItem('sal_v3',JSON.stringify(leads));
 // Save to Google Sheet if URL set
 if(SHEET_URL.includes('script.google')){
   fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(d),headers:{'Content-Type':'application/json'}});
 }
 let msg=`Hello Salvation Tech Hub! FREE DEMO claim:%0A%0ABusiness: ${b}%0ASells: ${d.sell}%0AWhatsApp: ${w}%0ALocation: ${l}%0AProducts: ${d.prod}`;
 showToast('✅ Opening WhatsApp...');
 setTimeout(()=>window.open(`https://wa.me/233540042669?text=${msg}`,'_blank'),600);
 biz.value='';wa.value='';loc.value='';prod.value='';
}
</script>
</body></html>
